name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -count=1 ./...
      - name: Compile opt-in test suites
        run: |
          go test -exec=/usr/bin/true -tags=integration ./...
          go test -exec=/usr/bin/true -tags=load ./...
          go test -exec=/usr/bin/true -tags=manual ./internal/test/
